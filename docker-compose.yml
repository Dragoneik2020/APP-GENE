version: '3.8'

services:
  backend:
    build:
      context: ./PlanFit/backend
      dockerfile: Dockerfile
    container_name: planfit-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001

  frontend:
    build:
      context: ./PlanFit
      dockerfile: Dockerfile
    container_name: planfit-web
    restart: unless-stopped
    environment:
      - EXPO_PUBLIC_API_URL=https://api.fitgenius.rincon-z.com
