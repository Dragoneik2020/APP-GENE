services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitgenius-api
    restart: unless-stopped
    volumes:
      - backend-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-fitgenius_secret_change_in_production}
      - GROQ_API_KEY=${GROQ_API_KEY:-}

  frontend:
    build:
      context: ./FitGenius
      dockerfile: Dockerfile
    container_name: fitgenius-web
    restart: unless-stopped
    environment:
      - EXPO_PUBLIC_API_URL=https://api.fitgenius.rincon-z.com
    depends_on:
      - backend

volumes:
  backend-data:
    driver: local
