version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitgenius-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-fitgenius_secret_change_in_production}
      - GROQ_API_KEY=${GROQ_API_KEY:-}

volumes:
  backend-data:
    driver: local
