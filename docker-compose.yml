version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitgenius-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-fitgenius_secret_change_in_production}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/exercises"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./FitGenius
      dockerfile: Dockerfile
    container_name: fitgenius-app
    restart: unless-stopped
    ports:
      - "19000:19000"
      - "19006:19006"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:3001

volumes:
  backend-data:
    driver: local
